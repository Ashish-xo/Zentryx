<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <meta name="theme-color" content="#070d1f" />
    <title>Zentryx | Digital Frontier</title>
    <meta name="description"
      content="Zentryx — your smart travel companion. Real-time routes, live weather, curated stays, community chat and an AI co-pilot for every trip." />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zentryx" />
    <meta property="og:title" content="Zentryx | Digital Frontier" />
    <meta property="og:description"
      content="Your smart travel companion — real-time routes, live weather, curated stays, community chat and an AI co-pilot." />
    <meta property="og:url" content="https://zentryx-ochre.vercel.app/" />
    <meta property="og:image" content="https://zentryx-ochre.vercel.app/assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tailwind CDN (same as original — swapped for CLI build later) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "frontier-deep": "#040816",
              "frontier-navy": "#11192e",
              "frontier-indigo": "#a3a6ff",
              "frontier-lime": "#ceee93",
              "frontier-text": "#C41E3A",
              "primary": "#a3a6ff",
              "on-primary": "#070d1f",
              "secondary": "#ceee93",
              "background": "#070d1f",
              "surface": "#11192e",
              "surface-variant": "#1d2642"
            },
            fontFamily: {
              "headline": ["'Space Grotesk'", "sans-serif"],
              "body": ["'Space Grotesk'", "sans-serif"],
              "label": ["'Space Grotesk'", "sans-serif"]
            },
            borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "9999px" }
          }
        }
      };
    </script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Cinematic Boot Sequence -->
    <div id="boot-overlay" aria-hidden="true" style="position:fixed;inset:0;z-index:99999;background:#040816;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s ease,visibility .8s">
      <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(163,166,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(163,166,255,.05) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%)"></div>
      <div id="boot-logo" style="font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(2rem,8vw,3.5rem);letter-spacing:.45em;text-indent:.45em;color:#fff;text-shadow:0 0 30px rgba(163,166,255,.8),0 0 60px rgba(206,238,147,.4);opacity:0;animation:bootLogoIn .9s cubic-bezier(.22,1,.36,1) forwards">ZENTRYX</div>
      <div id="boot-line" style="font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:#a3a6ff;margin-top:18px;min-height:16px;opacity:0;animation:bootFadeIn .5s ease .5s forwards">Establishing network link...</div>
      <div style="width:min(320px,60vw);height:2px;background:rgba(163,166,255,.15);margin-top:26px;overflow:hidden;opacity:0;animation:bootFadeIn .4s ease .7s forwards">
        <div style="height:100%;width:0%;background:linear-gradient(90deg,#a3a6ff,#ceee93);box-shadow:0 0 12px rgba(206,238,147,.7);animation:bootProgress 1.6s cubic-bezier(.65,0,.35,1) .7s forwards"></div>
      </div>
      <style>
        @keyframes bootLogoIn{0%{opacity:0;transform:scale(1.6);letter-spacing:.9em}60%{opacity:1}100%{opacity:1;transform:scale(1);letter-spacing:.45em}}
        @keyframes bootFadeIn{to{opacity:1}}
        @keyframes bootProgress{to{width:100%}}
        #boot-overlay.done{opacity:0;visibility:hidden;pointer-events:none}
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
